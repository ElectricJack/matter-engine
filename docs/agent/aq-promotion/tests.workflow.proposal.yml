# Owner composition proposal for .github/workflows/tests.yml; not an active
# workflow or trust-policy change. Retain the fleet verifier source/tests and
# main-attestation assets; keep this as the sole Windows/Linux reusable workflow.
name: Native Windows
on:
  push:
    branches: ['aq/*', 'aq/parent/**', 'aq/batches/**', 'aq/integration/**', 'aq/promote/**', 'aq/backmerge/**']
  pull_request:
    branches: [dev, staging, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      tier:
        type: choice
        default: full
        options: [full, fast]
      force_clean:
        type: boolean
        default: false
      disable_compiler_cache:
        type: boolean
        default: false
  workflow_call:
    inputs:
      tier:
        type: string
        default: full
        required: false
      force_clean:
        type: boolean
        default: false
        required: false
      disable_compiler_cache:
        type: boolean
        default: false
        required: false
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-foundations:
    name: Linux foundation build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test the attestation verifier
        run: |
          test -s tools/tests/test_aq_attestation.py
          python3 -m unittest discover -s tools/tests -p test_aq_attestation.py -v
      - name: Build and test the portable foundations
        run: |
          make -C libs/MemoryLib -j2 test
          make -C libs/MeshChartingLib/tests -j2 run
          make -C libs/AssetStoreLib -j2 test
  native:
    name: ${{ (inputs.tier == 'fast' && github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/main' && github.base_ref != 'staging' && github.base_ref != 'main' && github.event_name != 'schedule') && 'Native Windows fast build and tests' || 'Native Windows build and tests' }}
    runs-on: [self-hosted, Windows, X64, matter-engine-msvc]
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '12'
      CTEST_PARALLEL_LEVEL: '6'
      MATTER_CI_TIER: ${{ inputs.tier || 'full' }}
      MATTER_CI_FORCE_CLEAN: ${{ inputs.force_clean || github.event_name == 'schedule' }}
      MATTER_CI_DISABLE_CACHE: ${{ inputs.disable_compiler_cache || github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and test explicitly selected tier
        shell: powershell
        run: ./tools/ci-windows.ps1 -RequireExplicitTier -Tier $env:MATTER_CI_TIER -ForceClean:($env:MATTER_CI_FORCE_CLEAN -eq 'true') -DisableCompilerCache:($env:MATTER_CI_DISABLE_CACHE -eq 'true')
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/ci/
          if-no-files-found: error
