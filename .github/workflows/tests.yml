name: Native Windows
on:
  push:
    branches: ['aq/**']
  pull_request:
    branches: [dev, staging, main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  linux-foundations:
    name: Linux foundation build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Test the attestation verifier
        run: python3 -m unittest discover -s tools/tests -p test_aq_attestation.py -v
      - name: Build and test the portable foundations
        run: |
          make -C libs/MemoryLib -j2 test
          make -C libs/MeshChartingLib/tests -j2 run
          make -C libs/AssetStoreLib -j2 test
  native:
    name: Native Windows build and tests
    runs-on: [self-hosted, Windows, X64, matter-engine-msvc]
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      CTEST_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build, test and validate package
        shell: powershell
        run: ./tools/ci-windows.ps1
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/ci/
          if-no-files-found: error
