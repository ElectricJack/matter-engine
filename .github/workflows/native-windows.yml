name: Native Windows
on:
  push:
    branches: [main, dev, staging, 'aq/batches/**', 'aq/integration/**']
  workflow_dispatch:
    inputs:
      tier:
        type: choice
        default: auto
        options: [auto, fast, full]
      clean:
        type: boolean
        default: false
  schedule:
    - cron: '17 10 * * *'
concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    name: ${{ (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main' || github.event_name == 'schedule' || inputs.tier == 'full') && 'Native Windows build and tests' || 'Native Windows fast build and tests' }}
    runs-on: [self-hosted, Windows, X64, matter-engine-msvc]
    timeout-minutes: 90
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '12'
      CTEST_PARALLEL_LEVEL: '6'
      MATTER_CI_TIER: ${{ inputs.tier || 'auto' }}
      MATTER_CI_FORCE_CLEAN: ${{ github.event_name == 'schedule' || inputs.clean == true }}
      MATTER_CI_DISABLE_CACHE: ${{ github.event_name == 'schedule' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and test selected tier
        shell: powershell
        run: ./tools/ci-windows.ps1 -Tier $env:MATTER_CI_TIER -ForceClean:($env:MATTER_CI_FORCE_CLEAN -eq 'true') -DisableCompilerCache:($env:MATTER_CI_DISABLE_CACHE -eq 'true')
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-windows-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/ci/
          if-no-files-found: error
